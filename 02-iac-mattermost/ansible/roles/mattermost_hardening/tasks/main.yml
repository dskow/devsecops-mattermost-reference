---
# STIG-aligned hardening tasks for the Mattermost RHEL 8/9 host.
#
# Each task is annotated with the STIG Vul-ID it addresses where applicable.
# Full STIG checklist is in 03-compliance/stig-checklist-mattermost.md.

# -----------------------------------------------------------------------------
# Login banner (RHEL-08-010040, RHEL-08-010049)
# -----------------------------------------------------------------------------

- name: Install DoD login banner
  ansible.builtin.copy:
    dest: /etc/issue
    mode: "0644"
    content: |
      You are accessing a U.S. Government (USG) Information System (IS) that is
      provided for USG-authorized use only. By using this IS (which includes any
      device attached to this IS), you consent to the following conditions:
      ... (full DoD warning banner) ...

- name: Configure SSH to display banner
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Banner"
    line: "Banner /etc/issue"
    state: present
  notify: restart sshd

# -----------------------------------------------------------------------------
# SSH (RHEL-08-010500, RHEL-08-010550, RHEL-08-040340)
# -----------------------------------------------------------------------------

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: restart sshd

- name: Set SSH client alive interval
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?ClientAliveInterval"
    line: "ClientAliveInterval 600"
  notify: restart sshd

- name: Set SSH client alive count max
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?ClientAliveCountMax"
    line: "ClientAliveCountMax 0"
  notify: restart sshd

# -----------------------------------------------------------------------------
# Password policy (RHEL-08-020100 through 020330)
# -----------------------------------------------------------------------------

- name: Configure password complexity (pwquality)
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: "minlen",   value: "15" }
    - { key: "minclass", value: "4" }
    - { key: "ucredit",  value: "-1" }
    - { key: "lcredit",  value: "-1" }
    - { key: "dcredit",  value: "-1" }
    - { key: "ocredit",  value: "-1" }
    - { key: "difok",    value: "8" }

# -----------------------------------------------------------------------------
# FIPS mode (RHEL-08-010020)
# -----------------------------------------------------------------------------

- name: Check current FIPS state
  ansible.builtin.command: fips-mode-setup --check
  register: fips_state
  changed_when: false
  failed_when: false

- name: Enable FIPS mode
  ansible.builtin.command: fips-mode-setup --enable
  when: "'enabled' not in fips_state.stdout"
  notify: reboot host

# -----------------------------------------------------------------------------
# Audit (RHEL-08-030000 series)
# -----------------------------------------------------------------------------

- name: Ensure auditd is installed
  ansible.builtin.dnf:
    name: audit
    state: present

- name: Ensure auditd is running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

- name: Install audit rules for privileged commands and identity files
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-stig.rules
    mode: "0640"
    content: |
      -w /etc/passwd -p wa -k identity
      -w /etc/group  -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/sudoers      -p wa -k actions
      -w /etc/sudoers.d/   -p wa -k actions
      -w /var/log/lastlog -p wa -k logins
      -a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=4294967295 -k privileged
  notify: reload auditd

# -----------------------------------------------------------------------------
# fapolicyd application allow-listing (RHEL-08-040135)
# -----------------------------------------------------------------------------

- name: Install fapolicyd
  ansible.builtin.dnf:
    name: fapolicyd
    state: present

- name: Enable fapolicyd
  ansible.builtin.systemd:
    name: fapolicyd
    enabled: true
    state: started

# -----------------------------------------------------------------------------
# Kernel parameters (RHEL-08-040280, etc.)
# -----------------------------------------------------------------------------

- name: Apply STIG-required sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { key: "net.ipv4.conf.all.send_redirects",     value: "0" }
    - { key: "net.ipv4.conf.default.send_redirects", value: "0" }
    - { key: "net.ipv4.ip_forward",                  value: "0" }
    - { key: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { key: "kernel.dmesg_restrict",                value: "1" }
    - { key: "fs.protected_hardlinks",               value: "1" }
    - { key: "fs.protected_symlinks",                value: "1" }

# -----------------------------------------------------------------------------
# Firewall (RHEL-08-040090)
# -----------------------------------------------------------------------------

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Allow Mattermost app port from ALB security group only (port also constrained at AWS SG layer)
  ansible.posix.firewalld:
    port: 8065/tcp
    permanent: true
    state: enabled
    immediate: true

# Handlers live in roles/mattermost_hardening/handlers/main.yml
# (Ansible loads them automatically — defining them in tasks/main.yml is a parse error.)
