name: Build and Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  build-and-scan:
    name: Build container and scan for CVEs
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outcome }}
      scan_status: ${{ steps.count.outputs.scan_status }}
      cve_summary: ${{ steps.count.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run Trivy twice intentionally:
      #   1. JSON output is parsed by jq for severity counts. The SARIF `level`
      #      field collapses all Trivy findings to "warning", so it can't be
      #      used to distinguish HIGH vs CRITICAL.
      #   2. SARIF output goes to the GitHub Security tab. Layer caching means
      #      the second invocation is effectively free.
      - name: Trivy scan (JSON, for severity counts)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '0'
          ignore-unfixed: true

      - name: Count findings by severity
        id: count
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "summary=scan did not produce results file" >> "$GITHUB_OUTPUT"
            echo "scan_status=failure" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)

          echo "summary=CRITICAL: ${CRITICAL}, HIGH: ${HIGH}" >> "$GITHUB_OUTPUT"

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "scan_status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "scan_status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy scan (SARIF, for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail job on HIGH/CRITICAL findings
        if: steps.count.outputs.scan_status == 'failure'
        run: |
          echo "Findings: ${{ steps.count.outputs.summary }}"
          exit 1

  notify-mattermost:
    name: Notify Mattermost on failure or findings
    needs: build-and-scan
    # Skip on fork PRs — secrets aren't injected, so the job would fail loudly
    # for what's actually expected behavior. Compares head repo to base repo;
    # equal means same-repo PR or push event.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.build-and-scan.result == 'failure' || needs.build-and-scan.outputs.scan_status == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for notifier script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post alert to Mattermost
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          BUILD_STATUS: ${{ needs.build-and-scan.outputs.build_status }}
          SCAN_STATUS: ${{ needs.build-and-scan.outputs.scan_status }}
          CVE_SUMMARY: ${{ needs.build-and-scan.outputs.cve_summary }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_mattermost.py
